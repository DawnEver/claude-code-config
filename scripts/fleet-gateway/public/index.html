<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Fleet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888); --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --link: var(--tg-theme-link-color, #2481cc); --warn: #d98a00; --bad: #d33; --ok: #2a9d4b;
    --claude: #d97757; --codex: #6b7bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card); border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--hint); font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
  select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--hint); background: var(--bg); color: var(--fg); }
  .banner { padding: 6px 10px; border-radius: 8px; margin-bottom: 10px; background: var(--card); color: var(--warn); }
  .banner:empty { display: none; }
  .host { background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .host header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .host header b { font-size: 15px; }
  .meta { color: var(--hint); font-size: 12px; }
  .online { color: var(--ok); } .offline { color: var(--bad); }
  .session { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; padding: 8px 0 0; border-top: 1px solid color-mix(in srgb, var(--hint) 25%, transparent); margin-top: 8px; }
  .session.link { cursor: pointer; }
  .agent { font-weight: 600; } .agent.claude { color: var(--claude); } .agent.codex { color: var(--codex); }
  .status { font-weight: 600; text-align: right; }
  .s-working { color: var(--ok); } .s-needs_approval, .s-needs_input { color: var(--warn); }
  .s-ended, .s-unknown, .s-stale { color: var(--hint); }
  .sub { grid-column: 1 / -1; color: var(--hint); font-size: 12px; }
  .empty { color: var(--hint); text-align: center; padding: 20px; }
</style>
</head>
<body>
  <h1>Agent Fleet</h1>
  <div class="stats">
    <div class="stat"><b id="n-hosts">-</b><span>Hosts online</span></div>
    <div class="stat"><b id="n-working">-</b><span>Working</span></div>
    <div class="stat"><b id="n-attention">-</b><span>Attention</span></div>
  </div>
  <div class="filters">
    <select id="f-host" aria-label="Host"></select>
    <select id="f-agent" aria-label="Agent"></select>
    <select id="f-project" aria-label="Project"></select>
    <select id="f-status" aria-label="Status"></select>
  </div>
  <div id="banner" class="banner"></div>
  <main id="hosts"><div class="empty">Loading…</div></main>
  <script type="module" src="app.js"></script>
</body>
</html>
