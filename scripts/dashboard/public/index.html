<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e); --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc); --accent-fg: var(--tg-theme-button-text-color, #fff);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --ok: #34c759; --warn: #ff9500; --bad: #ff3b30; --run: #0a84ff; --idle: #8e8e93;
    --claude: #d97757; --codex: #6b7bff;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { overflow-x: hidden; }
  body { margin: 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); font: 15px/1.35 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--fg); -webkit-tap-highlight-color: transparent; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--hint); font-size: 12px; }

  /* 1. Does anything need me? */
  .summary { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; background: var(--card); }
  .summary.alert { background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
  .summary-head { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .summary-sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .summary .row { margin-top: 8px; }

  /* 2. Filters */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600;
    background: var(--card); color: var(--fg); cursor: pointer; }
  .chip b { font-weight: 600; color: var(--hint); margin-left: 4px; }
  .chip.on { background: var(--accent); color: var(--accent-fg); }
  .chip.on b { color: inherit; opacity: .8; }
  .selects { display: flex; gap: 6px; margin-bottom: 10px; }
  .selects:empty { display: none; }
  select { flex: 1; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--sep); background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; }
  .banner { padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; background: var(--card); color: var(--warn); font-size: 13px; }
  .banner:empty { display: none; }

  /* 3. Where: one section per host */
  .host { margin-bottom: 14px; }
  .host.off { opacity: .6; }
  .host-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 6px; }
  .host-head .name { font-weight: 700; }
  .host-head .meta { margin-left: auto; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .empty { color: var(--hint); text-align: center; padding: 16px; font-size: 13px; }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; width: 100%; border: 0; background: none;
    color: inherit; font: inherit; text-align: left; }
  .list .row + .row { border-top: 1px solid var(--sep); }
  .row.link { cursor: pointer; }
  .row.link:active { background: var(--sep); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
  .main { flex: 1; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--hint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .agent { font-weight: 600; } .agent.claude { color: var(--claude); } .agent.codex { color: var(--codex); }
  .pill { flex: none; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--sep); color: var(--hint); }
  .chev { flex: none; color: var(--hint); font-size: 20px; line-height: 1; width: 10px; }

  .s-working .dot { background: var(--run); } .s-working .pill { background: color-mix(in srgb, var(--run) 15%, transparent); color: var(--run); }
  .s-needs_approval .dot, .s-needs_input .dot { background: var(--warn); }
  .s-needs_approval .pill, .s-needs_input .pill { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .s-idle .dot { background: var(--idle); }
  .s-stale .dot, .s-unknown .dot, .s-ended .dot { background: transparent; border: 2px solid var(--idle); }
  .on-dot { background: var(--ok); } .off-dot { background: transparent; border: 2px solid var(--idle); }

  /* Quota: one card per account. */
  /* Tabs: one question per view; the needs-you card above covers both. */
  .tabs { display: flex; gap: 4px; padding: 3px; margin-bottom: 12px; border-radius: 12px; background: var(--card); width: fit-content; }
  .tabs button { position: relative; border: 0; border-radius: 9px; padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 600;
    background: none; color: var(--hint); cursor: pointer; }
  .tabs button b { font-weight: 600; margin-left: 4px; opacity: .7; }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px color-mix(in srgb, var(--fg) 15%, transparent); }
  .tab-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--warn); color: #fff; font: 600 10px/16px system-ui, sans-serif; font-style: normal; text-align: center; }
  .event-list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .event { padding: 10px 12px; } .event + .event { border-top: 1px solid var(--sep); }
  .event.new { border-left: 3px solid var(--warn); }
  .event .text { font-size: 14px; overflow-wrap: anywhere; }
  .tab-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .quota-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
  .quota-card { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .quota-card.stale { opacity: .75; }
  .quota-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .quota-head .left { font-weight: 700; font-size: 17px; }
  .v-short .quota-head .left { color: var(--warn); } .v-exhausted .quota-head .left { color: var(--bad); }
  .warn { color: var(--warn); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .v-exhausted .warn { color: var(--bad); }
  .win { display: grid; grid-template-columns: 26px 1fr 44px; align-items: center; gap: 8px; margin-top: 10px; }
  .win .k { color: var(--hint); font-size: 12px; font-weight: 600; }
  .win .used { text-align: right; font-size: 13px; font-weight: 600; }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--sep); }
  .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--run); }
  .bar.hot .fill { background: var(--warn); }
  .bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg); opacity: .55; border-radius: 1px; }
  .win-sub { display: grid; grid-template-columns: 26px 1fr 44px; gap: 2px 8px; color: var(--hint); font-size: 12px; margin-top: 4px; }
  .win-sub > span { grid-column: 2 / 4; }
  .trend { grid-column: 2; display: flex; align-items: flex-end; gap: 2px; height: 18px; border-bottom: 1px dashed var(--sep); }
  .trend span { flex: 1; border-radius: 2px 2px 0 0; }
  .trend .seen { background: color-mix(in srgb, var(--run) 55%, transparent); }
  .trend .unseen { height: 100%; background: repeating-linear-gradient(45deg, var(--sep) 0 2px, transparent 2px 4px); }
  .trend .ahead { height: 2px; background: var(--sep); }
  .note { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; font-family: inherit; text-align: left; }
  .note.link { cursor: pointer; }
  .foot { margin-top: 8px; }
  .s-exhausted .dot { background: var(--bad); } .s-exhausted .pill { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

  /* Responsive, continuously: columns appear as the width allows (one per ~340 px); auto-fit
     collapses unused tracks, so the cards always share the full row. Spacing and the title
     scale with the viewport. No cap. */
  body { padding: clamp(12px, 2vw, 32px) clamp(12px, 2.5vw, 40px) calc(clamp(16px, 2vw, 32px) + env(safe-area-inset-bottom)); }
  h1 { font-size: clamp(20px, 1.2vw + 14px, 28px); }
  #hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 0 14px; align-items: start; }
  /* auto-fill here: a lone waiting session keeps card width instead of spanning the window. */
  .waiting { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 0 14px; }
  .selects select { max-width: 320px; }
</style>
</head>
<body>
  <header class="top"><h1>Agents Dashboard</h1><span id="updated" class="muted"></span></header>
  <section id="summary" class="summary"><div class="summary-head">Loading…</div></section>
  <nav id="tabs" class="tabs" role="tablist" hidden>
    <button role="tab" data-tab="sessions">Sessions <b id="n-sessions"></b></button>
    <button role="tab" data-tab="quota">Quota <b id="n-quota"></b><i class="tab-dot" id="quota-dot" hidden></i></button>
    <button role="tab" data-tab="events">Events <b id="n-events"></b><i class="tab-badge" id="events-badge" hidden></i></button>
  </nav>
  <div id="banner" class="banner"></div>
  <section id="quota" class="view" data-view="quota" hidden></section>
  <section id="events" class="view" data-view="events" hidden></section>
  <div class="view" data-view="sessions">
  <nav id="chips" class="chips" aria-label="Status"></nav>
  <div id="selects" class="selects"></div>
  <main id="hosts"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
