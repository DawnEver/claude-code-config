<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e); --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc); --accent-fg: var(--tg-theme-button-text-color, #fff);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --ok: #34c759; --warn: #ff9500; --bad: #ff3b30; --run: #0a84ff; --idle: #8e8e93;
    --claude: #d97757; --codex: #6b7bff;
    /* Three type levels by importance: headline (what is left, who needs you), key fact (use, reset, warning), secondary. */
    --t1: 16px; --t2: 14px; --t3: 12px;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { overflow-x: clip; }   /* clip, not hidden: hidden makes body a scroll box and breaks the sticky tab bar */
  body { margin: 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); font: 15px/1.35 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--fg); -webkit-tap-highlight-color: transparent; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; }
  #version { font-weight: 400; margin-left: 6px; }
  #version .commit { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .muted { color: var(--hint); font-size: var(--t3); }

  /* Loading, sign-in and access problems: the page's one message before any data. */
  .summary { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; background: var(--card); }
  .summary-head { font-weight: 700; font-size: var(--t1); }

  /* 2. Filters */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: var(--t2); font-weight: 600;
    background: var(--card); color: var(--fg); cursor: pointer; }
  .chip b { font-weight: 600; color: var(--hint); margin-left: 4px; }
  .chip.on { background: var(--accent); color: var(--accent-fg); }
  .chip.on b { color: inherit; opacity: .8; }
  .selects { display: flex; gap: 6px; margin-bottom: 10px; }
  .selects:empty { display: none; }
  select { flex: 1; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--sep); background: var(--bg); color: var(--fg); font: inherit; font-size: var(--t2); }
  .banner { padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; background: var(--card); color: var(--warn); font-size: var(--t2); }
  .banner:empty { display: none; }

  /* 3. Where: one section per host */
  .host { margin-bottom: 14px; }
  .host.off { opacity: .6; }
  .host-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 6px; }
  .host-head .name { font-weight: 700; }
  .host-head .meta { margin-left: auto; }
  .host-head.toggle { cursor: pointer; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .empty { color: var(--hint); text-align: center; padding: 16px; font-size: var(--t2); }

  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
  .main { flex: 1; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--hint); font-size: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .agent { font-weight: 600; } .agent.claude { color: var(--claude); } .agent.codex { color: var(--codex); }
  .chev { flex: none; color: var(--hint); }

  .s-working .dot { background: var(--run); }
  .s-needs_approval .dot, .s-needs_input .dot { background: var(--warn); }
  .s-idle .dot { background: var(--idle); }
  .s-stale .dot, .s-unknown .dot, .s-ended .dot { background: transparent; border: 2px solid var(--idle); }
  .on-dot { background: var(--ok); } .off-dot { background: transparent; border: 2px solid var(--idle); }

  /* Sessions as a Telegram chat list. */
  .chat { display: flex; align-items: center; gap: 10px; padding: 8px 12px; width: 100%; border: 0; background: none;
    color: inherit; font: inherit; text-align: left; }
  .list .chat + .chat { border-top: 1px solid var(--sep); }
  .chat.link { cursor: pointer; } .chat.link:active { background: var(--sep); }
  .avatar { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 18px; background: var(--idle); }
  .avatar.claude { background: var(--claude); } .avatar.codex { background: var(--codex); }
  .avatar.deepseek { background: #4d6bfe; }
  .avatar svg { width: 24px; height: 24px; fill: currentColor; }
  .avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border: 2px solid var(--card); }
  .chat-top, .chat-bottom { display: flex; align-items: center; gap: 6px; }
  .chat-top .title { flex: 1; }
  .chat-bottom .sub { flex: 1; margin-top: 2px; font-size: var(--t2); }
  .chat-time { flex: none; color: var(--hint); font-size: var(--t3); } .chat-time.fresh { color: var(--accent); }
  .badge { flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent); color: var(--accent-fg);
    font: 600 13px/22px system-ui, sans-serif; text-align: center; }
  .badge.at { padding: 0; width: 22px; }

  /* Machine load under each host header, Sessions and Quota (Config: this device). */
  .res { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; margin: 0 4px 8px; font-size: var(--t3); }
  .res-m { display: grid; grid-template-columns: 64px minmax(36px, 1fr) auto; gap: 6px; align-items: center; }
  .res-m .k { color: var(--hint); font-weight: 600; white-space: nowrap; }
  .res-t { white-space: nowrap; text-align: right; }
  .res-about { grid-column: 1 / -1; overflow-wrap: anywhere; }

  /* Tabs: one question per view. */
  .tabs { display: flex; gap: 4px; padding: 3px; margin-bottom: 12px; border-radius: 12px; background: var(--card); width: fit-content;
    max-width: 100%; box-sizing: border-box; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  /* Pinned (this device, default): the tab bar stays at the top while the page scrolls. */
  .pin-tabs .tabs { position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 6px color-mix(in srgb, var(--fg) 12%, transparent); }
  .tabs button { flex: none; white-space: nowrap; position: relative; border: 0; border-radius: 9px; padding: 7px 16px; font: inherit; font-size: var(--t2); font-weight: 600;
    background: none; color: var(--hint); cursor: pointer; }
  .tabs button b { font-weight: 600; margin-left: 4px; opacity: .7; }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px color-mix(in srgb, var(--fg) 15%, transparent); }
  .tab-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--warn); color: #fff; font: 600 10px/16px system-ui, sans-serif; font-style: normal; text-align: center; }
  /* Usage: totals, a bar per day split by agent, then ranked lists. */
  .usage-range { display: flex; gap: 4px; margin-bottom: 10px; }
  .usage-range button { border: 0; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: var(--t3); background: var(--card); color: var(--hint); cursor: pointer; }
  .usage-range button[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
  .usage-totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .usage-totals > div { background: var(--card); border-radius: 12px; padding: 8px 10px; }
  .usage-totals b { display: block; font-size: var(--t1); }
  .usage-totals span { font-size: var(--t3); color: var(--hint); }
  .usage-days { display: flex; align-items: flex-end; gap: 2px; height: 120px; background: var(--card); border-radius: 12px; padding: 8px; margin-bottom: 4px; }
  .usage-days .d { flex: 1; display: flex; flex-direction: column-reverse; height: 100%; min-width: 2px; }
  .usage-days .claude { background: #d97757; } .usage-days .codex { background: #10a37f; }
  .usage-axis { display: flex; justify-content: space-between; font-size: var(--t3); color: var(--hint); margin-bottom: 12px; }
  .usage-list { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .usage-list .u { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 8px 12px; font-size: var(--t2); position: relative; }
  .usage-list .u { width: 100%; border: 0; background: none; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
  .usage-list .u.on { background: color-mix(in srgb, var(--accent) 14%, transparent); } .usage-list .u.on .n { font-weight: 600; }
  .usage-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .usage-list .u + .u { border-top: 1px solid var(--sep); }
  .usage-list .u .share { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--link, #2481cc); }
  .usage-list .u .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .usage-list .u .m { color: var(--hint); font-size: var(--t3); }
  .event-list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .event { padding: 10px 12px; } .event + .event { border-top: 1px solid var(--sep); }
  .event.new { border-left: 3px solid var(--warn); }
  .event .text { font-size: var(--t2); overflow-wrap: anywhere; }
  .acct { display: inline-block; padding: 0 6px; border-radius: 6px; font-weight: 600; background: var(--sep); color: var(--fg); }
  .acct.v-short { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .acct.v-exhausted { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .acct-tags { display: flex; flex-wrap: wrap; gap: 4px; font-size: var(--t3); }
  .shared { margin-top: 4px; }
  /* Quota by host: one compact row per account, the glance "what is left where". */
  .qrows { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
  .qrow { padding: 10px 12px; cursor: pointer; } .qrow:active { background: var(--sep); }
  .qrow.stale { opacity: .75; }
  .qrow-top .chev { color: var(--hint); width: 12px; text-align: center; }
  .brow { display: flex; gap: 10px; align-items: baseline; cursor: default; } .brow .left { margin-left: auto; font-variant-numeric: tabular-nums; }
  .qdetail { margin-top: 2px; } .qrow + .qrow { border-top: 1px solid var(--sep); }
  .qrow-top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; }
  .qrow-top { font-size: var(--t1); } .qrow-top .left { font-weight: 700; }
  .qrow.v-short .left { color: var(--warn); } .qrow.v-exhausted .left { color: var(--bad); }
  /* A cell keeps its bar >= 36px: 22 + 36 + 34 + reset (~52) + gaps fits the 160px minimum. */
  .qmini { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 4px 12px; margin-top: 6px; }
  .qmini > div { display: grid; grid-template-columns: 22px minmax(36px, 1fr) 34px auto; gap: 6px; align-items: center; font-size: var(--t3); }
  .bar { min-width: 36px; }
  .k.bind { color: var(--fg); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .stale-v, .clock { opacity: .6; } .clock { font-size: var(--t3); }
  .qbest { font-size: var(--t3); color: var(--hint); margin: 0 4px 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .qref { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; cursor: default; font-size: var(--t2); }
  .qref .see { color: var(--hint); font-size: var(--t3); }
  .qmini .used, .qmini .reset { font-size: var(--t2); font-weight: 600; }
  .reset { text-align: right; white-space: nowrap; }
  .reset:empty { display: none; }
  .qmini .k { color: var(--hint); font-weight: 600; } .qmini .used { text-align: right; font-weight: 600; }
  /* Config: Display (this device), then Shared settings (all hosts), then Developer, collapsed. */
  .cfg { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
  .cfg-row { padding: 10px 12px; } .cfg-row + .cfg-row { border-top: 1px solid var(--sep); }
  .cfg-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .cfg-name { font-size: var(--t2); flex: 1 1 160px; }
  .cfg-h { font-size: var(--t3); font-weight: 600; color: var(--hint); margin: 10px 4px 4px; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--sep); }
  .seg button { border: 0; border-radius: 7px; padding: 5px 10px; font: inherit; font-size: var(--t3); font-weight: 600; background: none; color: var(--hint); cursor: pointer; white-space: nowrap; }
  .seg button[aria-checked="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 15%, transparent); }
  .hint { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--sep); color: var(--hint); font-size: 11px; cursor: help; }
  .mark { font-size: var(--t3); font-weight: 600; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); cursor: help; }
  .change { margin-top: 4px; } .change.ok { color: var(--ok); } .change.bad { color: var(--bad); white-space: normal; } .change.pending { color: var(--warn); }
  .dev { margin-top: 18px; } .dev summary { cursor: pointer; }
  .cfg-edit { display: flex; gap: 6px; align-items: center; }
  .cfg-edit input, .cfg-edit select { width: 96px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--sep); background: var(--bg); color: var(--fg); font: inherit; font-size: var(--t2); }
  .cfg-edit button { border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-size: var(--t2); font-weight: 600; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  .cfg-edit button:disabled { opacity: .4; cursor: default; }
  /* A host's own facts under its quota (read-only: who may control it lives in its files). */
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 12px; margin: 0 0 14px; font-size: var(--t3); background: var(--card); border-radius: 14px; }
  .facts dt { color: var(--hint); } .facts dd { margin: 0; }
  .section-h { font-size: var(--t2); text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 4px 4px 8px; }
  .tab-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .warn { color: var(--warn); font-size: var(--t2); font-weight: 600; margin-top: 6px; }
  .v-exhausted .warn { color: var(--bad); }
  .win { display: grid; grid-template-columns: 26px 1fr 44px auto; align-items: center; gap: 8px; margin-top: 10px; }
  .win .reset { font-size: var(--t2); font-weight: 600; min-width: 52px; }
  .win .k { color: var(--hint); font-size: var(--t3); font-weight: 600; }
  .win .used { text-align: right; font-size: var(--t2); font-weight: 600; }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--sep); }
  .bar.unknown { background: repeating-linear-gradient(135deg, var(--sep) 0 4px, transparent 4px 8px); } .bar.unknown .fill, .bar.unknown .pace { display: none; }
  .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--run); }
  .bar.hot .fill { background: var(--warn); }
  .bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg); opacity: .55; border-radius: 1px; }
  .win-sub { display: grid; grid-template-columns: 26px 1fr 44px auto; gap: 2px 8px; color: var(--hint); font-size: var(--t3); margin-top: 4px; }
  .win-sub > span { grid-column: 2 / 5; }
  .win-sub > span:empty { display: none; }
  .trend-wrap { grid-column: 2; }
  .trend .now { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 1.5px solid var(--fg); opacity: .6; }
  .axis { position: relative; height: 13px; margin-top: 2px; font-size: 10px; color: var(--hint); }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis span::before { content: ''; position: absolute; left: 50%; top: -4px; height: 3px; border-left: 1px solid var(--sep); }
  .trend { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 18px; border-bottom: 1px dashed var(--sep); }
  .trend span { flex: 1; border-radius: 2px 2px 0 0; }
  .trend .seen { background: color-mix(in srgb, var(--run) 55%, transparent); }
  .trend .unseen { height: 100%; background: repeating-linear-gradient(45deg, var(--sep) 0 2px, transparent 2px 4px); }
  .trend .ahead { height: 2px; background: var(--sep); }
  .note { display: block; margin-top: 8px; font-size: var(--t3); font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; font-family: inherit; text-align: left; }
  .note.link { cursor: pointer; }
  .foot { margin-top: 8px; }

  /* Responsive, continuously: columns appear as the width allows (one per ~340 px). Spacing and the title
     scale with the viewport. No cap. */
  body { padding: clamp(12px, 2vw, 32px) clamp(12px, 2.5vw, 40px) calc(clamp(16px, 2vw, 32px) + env(safe-area-inset-bottom)); }
  h1 { font-size: clamp(20px, 1.2vw + 14px, 28px); }
  /* Packed: hosts flow down each column and fill the gaps. */
  #hosts, .quota-hosts { column-width: 340px; column-gap: 14px; }
  #hosts > .host, .quota-hosts > .host { break-inside: avoid; }
  /* auto-fill here: a lone session keeps card width instead of spanning the window. */
  .waiting { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 0 14px; }
  .selects select { max-width: 320px; }
</style>
</head>
<body>
  <header class="top"><h1><span id="title">Agents Dashboard</span> <span id="version" class="muted"></span></h1><span id="updated" class="muted"></span></header>
  <section id="summary" class="summary"><div class="summary-head"></div></section>
  <nav id="tabs" class="tabs" role="tablist" hidden>
    <button role="tab" data-tab="sessions"><span class="label"></span> <b id="n-sessions"></b></button>
    <button role="tab" data-tab="quota"><span class="label"></span> <b id="n-quota"></b><i class="tab-dot" id="quota-dot" hidden></i></button>
    <button role="tab" data-tab="usage"><span class="label"></span></button>
    <button role="tab" data-tab="events"><span class="label"></span> <b id="n-events"></b><i class="tab-badge" id="events-badge" hidden></i></button>
    <button role="tab" data-tab="config"><span class="label"></span></button>
  </nav>
  <div id="banner" class="banner"></div>
  <section id="quota-view" class="view" data-view="quota" hidden></section>
  <section id="usage-view" class="view" data-view="usage" hidden></section>
  <section id="events-view" class="view" data-view="events" hidden></section>
  <section id="config-view" class="view" data-view="config" hidden></section>
  <div class="view" data-view="sessions">
  <nav id="chips" class="chips" aria-label="Status"></nav>
  <div id="selects" class="selects"></div>
  <main id="hosts"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
